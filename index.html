<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MATH survivor — Stage 4.7</title>
<style>
  :root{
    --bg:#0b0e14;
    --panel:#141927;
    --ink:#e8ecf5;
    --hp:#e5484d;
    --xp:#4cc38a;
    --gold:#f5c542;
    --accent:#7aa2ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Segoe UI','Malgun Gothic',sans-serif;color:var(--ink);
    overscroll-behavior:none;}
  #wrap{position:relative;width:100vw;height:100vh;}
  canvas{display:block;width:100%;height:100%;touch-action:none;
    -webkit-user-select:none;user-select:none;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;pointer-events:none;}
  .barShell{height:16px;border-radius:8px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);overflow:hidden;}
  #xpFill{height:100%;width:0%;background:linear-gradient(90deg,#2f9e6e,var(--xp));
    transition:width .15s;}
  #topRow{display:flex;justify-content:space-between;align-items:center;
    margin-top:6px;font-size:14px;font-weight:600;text-shadow:0 1px 3px #000;}
  #lvlTag{color:var(--xp);}
  #timeTag{font-size:20px;letter-spacing:2px;font-variant-numeric:tabular-nums;}
  #killTag{color:var(--gold);}

  #skillBar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;pointer-events:none;flex-wrap:wrap;max-width:60vw;}
  .skillChip{background:rgba(20,25,39,.85);border:1px solid rgba(255,255,255,.15);
    border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;
    display:flex;align-items:center;gap:4px;}
  .skillChip small{color:#f5c542;font-size:11px;}

  #eliteWarn{position:absolute;top:70px;left:50%;transform:translateX(-50%);
    font-size:18px;font-weight:800;color:#ff6b6b;text-shadow:0 0 12px rgba(255,60,60,.8);
    letter-spacing:3px;opacity:0;transition:opacity .3s;pointer-events:none;}
  #eliteWarn.show{opacity:1;animation:blink .5s infinite alternate;}
  @keyframes blink{from{opacity:1;}to{opacity:.35;}}

  /* ---------- 오버레이 공통 ---------- */
  /* ===== 타이틀(시작) 화면 ===== */
  #titleOverlay{position:absolute;inset:0;z-index:60;cursor:pointer;
    display:flex;align-items:flex-end;justify-content:center;
    background:#0b0e14 center/cover no-repeat;}
  #titleOverlay.hidden{display:none;}
  #titleHint{margin-bottom:6vh;font-size:22px;font-weight:900;color:#fff;
    text-shadow:0 2px 10px #000,0 0 18px rgba(94,234,212,.8);
    animation:titleBlink 1.2s ease-in-out infinite;pointer-events:none;}
  @keyframes titleBlink{0%,100%{opacity:1}50%{opacity:.25}}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,7,12,.72);backdrop-filter:blur(2px);z-index:10;}
  .panel{background:var(--panel);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:28px 36px;text-align:center;max-width:460px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);}
  .panel h1{font-size:26px;margin-bottom:10px;}
  .panel p{font-size:14px;line-height:1.7;color:#aab2c5;margin-bottom:18px;}
  .panel button, .cardBtn, .choiceBtn, #quizSubmit{pointer-events:auto;cursor:pointer;border:none;
    border-radius:8px;font-weight:700;}
  .panel > button{padding:12px 28px;font-size:16px;background:var(--accent);color:#0b0e14;}
  .panel > button:hover{filter:brightness(1.1);}
  .hidden{display:none !important;}
  kbd{background:rgba(255,255,255,.12);border-radius:4px;padding:2px 7px;
    font-size:12px;border:1px solid rgba(255,255,255,.2);}

  /* ---------- 스킬 카드 ---------- */
  #cardRow, #startCardRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .cardBtn{width:172px;background:#1a2033;border:2px solid rgba(255,255,255,.14);
    border-radius:12px;padding:18px 12px;color:var(--ink);text-align:center;
    transition:transform .12s, border-color .12s;}
  .cardBtn:hover{transform:translateY(-6px);border-color:var(--gold);}
  .cardBtn .icon{font-size:34px;display:block;margin-bottom:8px;}
  .cardBtn .name{font-size:15px;font-weight:800;margin-bottom:2px;}
  .cardBtn .lv{font-size:12px;color:var(--gold);margin-bottom:8px;display:block;}
  .cardBtn .desc{font-size:12px;color:#aab2c5;line-height:1.5;}
  .cardBtn .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;
    margin-bottom:8px;font-weight:800;}
  .tag.active{background:rgba(122,162,255,.18);color:var(--accent);}
  .tag.passive{background:rgba(76,195,138,.18);color:var(--xp);}
  .tag.bonus{background:rgba(245,197,66,.18);color:var(--gold);}
  .tag.evo{background:rgba(245,197,66,.28);color:var(--gold);}
  .cardBtn.evoCard{border-color:var(--gold);
    box-shadow:0 0 22px rgba(245,197,66,.4);
    animation:evoGlow 1.2s infinite alternate;}
  @keyframes evoGlow{from{box-shadow:0 0 12px rgba(245,197,66,.3);}
    to{box-shadow:0 0 26px rgba(245,197,66,.65);}}
  #startCardRow .cardBtn{width:158px;}

  /* ---------- 수학 문제 팝업 ---------- */
  #quizPanel{max-width:430px;width:92vw;}
  #quizTimerShell{height:10px;border-radius:6px;background:rgba(255,255,255,.1);
    overflow:hidden;margin-bottom:16px;}
  #quizTimerFill{height:100%;width:100%;background:var(--accent);}
  #quizTimerFill.danger{background:var(--hp);}
  #quizType{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-bottom:8px;}
  #quizQ{font-size:22px;font-weight:800;line-height:1.5;margin-bottom:14px;min-height:34px;}
  #quizFig{margin:0 auto 14px;display:block;}
  #quizChoices{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .choiceBtn{padding:14px 8px;font-size:18px;background:#1a2033;color:var(--ink);
    border:2px solid rgba(255,255,255,.14);}
  .choiceBtn:hover{border-color:var(--accent);}
  #quizInputRow{display:flex;gap:8px;justify-content:center;}
  #quizInput{width:150px;padding:12px;font-size:20px;text-align:center;border-radius:8px;
    border:2px solid rgba(255,255,255,.2);background:#0d1120;color:var(--ink);font-weight:800;}
  #quizInput:focus{outline:none;border-color:var(--accent);}
  #quizSubmit{padding:12px 22px;font-size:16px;background:var(--accent);color:#0b0e14;}
  #quizFeedback{margin-top:12px;font-size:15px;font-weight:800;min-height:22px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="barShell"><div id="xpFill"></div></div>
    <div id="topRow">
      <span id="lvlTag">LV 1</span>
      <span id="timeTag">00:00</span>
      <span id="killTag">처치 0</span>
    </div>
  </div>
  <div id="skillBar"></div>
  <div id="eliteWarn">⚠ 엘리트 몬스터 출현 ⚠</div>

  <!-- 타이틀 화면 (Touch to Start) -->
  <div id="titleOverlay">
    <div id="titleHint">Touch to Start</div>
  </div>

  <!-- 시작: 액티브 스킬 선택 -->
  <div id="startOverlay" class="overlay hidden">
    <div class="panel" style="max-width:900px;background:transparent;border:none;box-shadow:none;">
      <h1 style="text-shadow:0 2px 8px #000;">MATH survivor</h1>
      <p style="text-shadow:0 1px 4px #000;">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 방향키 이동 · 모바일은 화면 드래그(가상 조이스틱) · 공격은 자동<br>
        레벨업 시 수학 문제(⏱15초)를 풀면 스킬 획득 · 오답 시 체력 10% 감소<br><br>
        <b>시작 무기를 선택하세요</b></p>
      <div id="startCardRow"></div>
    </div>
  </div>

  <!-- 레벨업 스킬 카드 선택 -->
  <div id="cardOverlay" class="overlay hidden">
    <div class="panel" style="max-width:600px;background:transparent;border:none;box-shadow:none;">
      <h1 style="text-shadow:0 2px 8px #000;">⬆ 레벨업! 스킬을 선택하세요</h1>
      <p style="text-shadow:0 1px 4px #000;">카드를 고르면 수학 문제가 출제됩니다</p>
      <div id="cardRow"></div>
    </div>
  </div>

  <!-- 수학 문제 팝업 -->
  <div id="quizOverlay" class="overlay hidden">
    <div class="panel" id="quizPanel">
      <div id="quizTimerShell"><div id="quizTimerFill"></div></div>
      <div id="quizType"></div>
      <div id="quizQ"></div>
      <svg id="quizFig" class="hidden" width="240" height="150"></svg>
      <div id="quizChoices"></div>
      <div id="quizInputRow" class="hidden">
        <input id="quizInput" type="number" inputmode="numeric" placeholder="답">
        <button id="quizSubmit">제출</button>
      </div>
      <div id="quizFeedback"></div>
    </div>
  </div>

  <!-- 게임 오버 -->
  <div id="overOverlay" class="overlay hidden">
    <div class="panel">
      <h1>💀 게임 오버</h1>
      <p id="overMsg"></p>
      <button id="retryBtn">다시 도전</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
 * MATH survivor — 2.1단계
 *  [변경1] 시작 시 액티브 스킬 6종 중 1개 선택 (기본 지팡이 제거)
 *  [변경2] 레벨업 카드 풀에 모든 액티브+패시브 포함
 *          → 액티브 6종(채찍/지팡이/단검/도끼/십자가/마늘) 공격 로직 전체 구현
 *  [변경3] 마법 지팡이: 투사체가 늘어나도 '가장 가까운 적' 한 방향으로만

function applySkillStats(){
  const oldMax = player.hpMax;
  player.hpMax = Math.floor(BASE.hpMax * (1 + 0.2 * SKILLS.blackHeart.lv));
  if(player.hpMax > oldMax) player.hp += player.hpMax - oldMax;
  player.hp = clamp(player.hp, 0, player.hpMax);
  player.regen = 0.2 * SKILLS.redHeart.lv;
  player.dmgReduce = SKILLS.armGuard.lv;
}

function evoReady(key){
  const s = SKILLS[key];
  return s && s.kind==='active' && !s.evolved
      && s.lv >= MAX_SKILL_LEVEL
      && SKILLS[EVOLUTIONS[key].pair].lv >= MAX_SKILL_LEVEL;
}

function skillLevelUp(key){
  const s = SKILLS[key];
  let gain = 1;
  if(SKILLS.clover.lv > 0 && Math.random() < 0.1 * SKILLS.clover.lv) gain = 2;
  s.lv = Math.min(MAX_SKILL_LEVEL, s.lv + gain);
  applySkillStats();
  renderSkillBar();
  return gain;
}

function renderSkillBar(){
  const bar = document.getElementById('skillBar');
  bar.innerHTML = '';
  for(const key in SKILLS){
    const s = SKILLS[key];
    if(s.lv > 0){
      const chip = document.createElement('div');
      chip.className = 'skillChip';
      chip.innerHTML = s.evolved
        ? `${EVOLUTIONS[key].icon} <small style="color:#f5c542">EVO</small>`
        : `${s.icon} <small>Lv${s.lv}</small>`;
      bar.appendChild(chip);
    }
  }
}

  const m = state.time/60;
  const p = offscreenPos(80);
  boss = {
    x:p.x, y:p.y, r:46, boss:true, elite:false,
    hp: 2800 + m*1600, hpMax: 2800 + m*1600,
    speed: 36,
    dmg: eliteBaseDmg()*2,      // 엘리트의 2배
    xp:0, hitFlash:0, phase2:false,
  };
  monsters = monsters.filter(mm=> mm.elite);   // 일반 몬스터 소멸

}

// 플레이어 피격 공통 처리 (팔 보호대 적용, 사망 여부 반환)
function hurtPlayer(rawDmg){
  if(player.invuln>0 || state.over) return false;
  const dmg = Math.max(1, rawDmg - player.dmgReduce);
  player.hp -= dmg;
  player.invuln = 0.6;
  burst(player.x,player.y,'#e5484d',10);

}

// --- 채찍: 좌/우 교대 타격, 횟수 = 레벨 / 진화: 초당 10회 무쿨 ---
let whipEvoSide = 1;
function whipCooldown(){
  return SKILLS.whip.evolved ? 0.1 : 1.5 * cdMul();
}
function triggerWhip(){
  if(SKILLS.whip.evolved){
    whipEvoSide *= -1;
    execWhipSlash(whipEvoSide, true);   // 0.1초마다 좌우 교대 = 초당 10회
    return;
  }
  const lv = SKILLS.whip.lv;
  for(let i=0;i<lv;i++){
    whipQueue.push({ t:i*0.13, side: (i%2===0 ? 1 : -1) });
  }
}
function execWhipSlash(side, evo=false){
  const w = 140*rangeMul()*(evo?1.2:1), h = 76*rangeMul()*(evo?1.2:1);
  slashes.push({
    x: player.x + side*(player.r + w/2 - 6),
    y: player.y,
    w, h, side, life:0.16, maxLife:0.16,
    dmg: evo ? 32 : 14 + SKILLS.whip.lv*2,
    evo,
    hit: new Set(),
  });
}

// --- 마법 지팡이: 최근접 적 한 방향 연속 발사 / 진화: 무쿨 연사 ---
function wandCooldown(){
  return SKILLS.wand.evolved ? 0.12 : 1.1 * cdMul();
}
function triggerWand(){
  if(SKILLS.wand.evolved){ execWandShot(true); return; }
  const lv = SKILLS.wand.lv;
  for(let i=0;i<lv;i++) wandQueue.push({ t:i*0.11 });
}
function execWandShot(evo=false){
  // 발사 시점마다 최근접 적 1마리를 다시 조준 (한 방향)
  let best=null, bd=Infinity;
  for(const m of monsters){
    const d = dist2(player.x,player.y,m.x,m.y);
    if(d<bd){ bd=d; best=m; }
  }
  if(!best) return;
  const dx=best.x-player.x, dy=best.y-player.y, len=Math.hypot(dx,dy)||1;
  bullets.push({
    x:player.x, y:player.y,
    vx:dx/len*500, vy:dy/len*500,
    r:(evo?7:5)*rangeMul(),
    dmg: evo ? 22 : 12 + SKILLS.wand.lv,
    life:2,
    color: evo ? '#ffd76b' : '#7aa2ff',
  });
}

// --- 단검: 바라보는 방향 / 진화: 월아천충(관통 초승달 검기 무쿨) ---
function knifeCooldown(){
  return SKILLS.knife.evolved ? 0.16 : 1.0 * cdMul();
}
function triggerKnife(){
  const fx = player.face.x, fy = player.face.y;
  const len0 = Math.hypot(fx,fy)||1;
  const dx = fx/len0, dy = fy/len0;
  if(SKILLS.knife.evolved){
    bullets.push({
      x:player.x, y:player.y,
      vx:dx*540, vy:dy*540,
      r:26*rangeMul(), dmg:26, life:1.5,
      color:'#9d7bff', crescent:true,
      pierce:true, hit:new Set(),
      angle:Math.atan2(dy,dx),
    });
    return;
  }
  const lv = SKILLS.knife.lv;
  const px = -dy, py = dx;   // 수직 방향 (나란히 배치용)
  for(let i=0;i<lv;i++){
    const off = (i - (lv-1)/2) * 12;
    bullets.push({
      x:player.x + px*off, y:player.y + py*off,
      vx:dx*620, vy:dy*620,
      r:4*rangeMul(), dmg:10 + SKILLS.knife.lv, life:1.6, color:'#e8ecf5',
      knife:true, angle:Math.atan2(dy,dx),
    });
  }
}

// --- 도끼: 주변 휩쓸기 / 진화: 죽음의 도끼(범위 2배) ---
function axeCooldown(){ return Math.max(1.2, 3.0 - 0.22*(SKILLS.axe.lv-1)) * cdMul(); }

// --- 십자가: 빛 낙하 / 진화: 하늘의 심판(범위 2배, 개수 2배) ---
function crossCooldown(){ return 2.6 * cdMul(); }
function crossCount(){

function circleRect(cx,cy,cr, rx,ry,rw,rh){
  const nx = clamp(cx, rx-rw/2, rx+rw/2);
  const ny = clamp(cy, ry-rh/2, ry+rh/2);
  return dist2(cx,cy,nx,ny) < cr*cr;
}

const joy = { active:false, id:null, ox:0, oy:0, dx:0, dy:0, max:60 };
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  if(joy.active) return;
  const t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joy.ox = t.clientX; joy.oy = t.clientY;
  joy.dx = 0; joy.dy = 0;
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === joy.id){
      let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy;
      const len = Math.hypot(dx,dy);
      if(len > joy.max){ dx = dx/len*joy.max; dy = dy/len*joy.max; }
      joy.dx = dx; joy.dy = dy;
    }
  }
}, {passive:false});
function joyEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier === joy.id){
      joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
    }
  }
}
cv.addEventListener('touchend', joyEnd);
cv.addEventListener('touchcancel', joyEnd);

function inputVec(){
  let x=0,y=0;
  if(keys['a']||keys['arrowleft'])  x-=1;
  if(keys['d']||keys['arrowright']) x+=1;
  if(keys['w']||keys['arrowup'])    y-=1;
  if(keys['s']||keys['arrowdown'])  y+=1;
  // 조이스틱 입력 (데드존 8px, 키보드보다 우선)
  if(joy.active && Math.hypot(joy.dx,joy.dy) > 8){
    x = joy.dx; y = joy.dy;
  }
  if(x||y){ const len=Math.hypot(x,y); x/=len; y/=len; }
  return {x,y};
}

           w: cv.width, h: cv.height };

  else if(side===1){ x=rand(c.x-margin, c.x+c.w+margin); y=c.y+c.h+margin; }
  else if(side===2){ x=c.x-margin; y=rand(c.y-margin, c.y+c.h+margin); }
  else { x=c.x+c.w+margin; y=rand(c.y-margin, c.y+c.h+margin); }

}

let pendingLevelUps = 0;
function gainXP(amount){
  if(player.level >= MAX_LEVEL) return;
  player.xp += amount;
  while(player.xp >= xpNeeded(player.level) && player.level < MAX_LEVEL){
    player.xp -= xpNeeded(player.level);
    player.level++;
    pendingLevelUps++;
  }
  if(pendingLevelUps>0 && !state.paused) openCardSelect();
}

function buildCardPool(){
  const pool = [];
  for(const key in SKILLS){
    const s = SKILLS[key];
    if(s.evolved) continue;
    if(s.lv < MAX_SKILL_LEVEL) pool.push(key);
  }
  return pool;
}

function makeCardBtn(key, onPick){
  const btn = document.createElement('button');
  btn.className = 'cardBtn';
  if(key==='__bonusHeal'){
    btn.innerHTML = `<span class="icon">🍱</span>
      <span class="tag bonus">보너스</span>
      <div class="name">특식</div>
      <span class="lv">&nbsp;</span>
      <div class="desc">체력 30% 회복</div>`;
  }else if(key.startsWith('evo:')){
    const base = key.slice(4);
    const e = EVOLUTIONS[base];
    btn.classList.add('evoCard');
    btn.innerHTML = `<span class="icon">${e.icon}</span>
      <span class="tag evo">진 화</span>
      <div class="name">${e.name}</div>
      <span class="lv">${SKILLS[base].icon} ${SKILLS[base].name} 진화!</span>
      <div class="desc">${e.desc}</div>`;
  }else{
    const s = SKILLS[key];
    btn.innerHTML = `<span class="icon">${s.icon}</span>
      <span class="tag ${s.kind}">${s.kind==='active'?'액티브':'패시브'}</span>
      <div class="name">${s.name}</div>
      <span class="lv">${s.lv===0 ? 'NEW!' : `Lv${s.lv} → Lv${s.lv+1}`}</span>
      <div class="desc">${s.desc}</div>`;
  }
  btn.addEventListener('click', ()=> onPick(key));
  return btn;
}

function openCardSelect(){
  state.paused = true;
  clearKeys();
  pendingLevelUps--;
  let pool = shuffle(buildCardPool()).slice(0,3);

  // 진화 조건 충족 시: 진화 카드를 첫 슬롯에 확정 배치
  const readyEvos = Object.keys(EVOLUTIONS).filter(evoReady);
  if(readyEvos.length > 0){
    const evoKey = 'evo:' + readyEvos[randi(0, readyEvos.length-1)];
    if(pool.length===0) pool = [evoKey];

  }

  cardRow.innerHTML = '';
  for(const key of pool) cardRow.appendChild(makeCardBtn(key, onCardPicked));
  cardOverlay.classList.remove('hidden');
}

function genMixed(){
  const type = randi(0,5);
  let text, ans;
  if(type===0){ const a=randi(10,60),b=randi(2,9),c=randi(2,9);
    text=`${a} + ${b} × ${c}`; ans=a+b*c; }
  else if(type===1){ const b=randi(2,9),c=randi(2,9),a=b*c+randi(5,40);
    text=`${a} − ${b} × ${c}`; ans=a-b*c; }
  else if(type===2){ const a=randi(3,15),b=randi(3,15),c=randi(2,9);
    text=`(${a} + ${b}) × ${c}`; ans=(a+b)*c; }
  else if(type===3){ const a=randi(3,12),b=randi(3,9),c=randi(2,20);
    text=`${a} × ${b} − ${c}`; ans=a*b-c; if(ans<0){ return genMixed(); } }
  else if(type===4){ const b=randi(2,9),q=randi(3,12),a=b*q,c=randi(5,30);
    text=`${a} ÷ ${b} + ${c}`; ans=q+c; }
  else { const c=randi(2,9),q=randi(3,12),s=c*q,a=randi(1,s-1),b=s-a;
    text=`(${a} + ${b}) ÷ ${c}`; ans=q; }
  return { typeName:'자연수의 혼합 계산', q:`${text} = ?`, answer:ans, format:'choice', fig:null };
}
function genGcdLcm(){
  const isGcd = Math.random()<0.5;
  let a,b;
  if(isGcd){
    const g = randi(2,10);
    do{ a = g*randi(2,Math.floor(50/g)); b = g*randi(2,Math.floor(50/g)); }while(a===b);
    return { typeName:'약수와 배수', q:`${a}와(과) ${b}의 최대공약수는?`,
             answer:gcd(a,b), format:'choice', fig:null };
  }else{
    do{ a = randi(2,20); b = randi(2,20); }while(a===b);
    return { typeName:'약수와 배수', q:`${a}와(과) ${b}의 최소공배수는?`,
             answer:a*b/gcd(a,b), format:'choice', fig:null };
  }
}

      <text x="138" y="76" fill="${T}" font-size="13">${fig.h}cm</text>`;
  }else{
    inner=`<polygon points="80,35 160,35 195,115 45,115" fill="rgba(122,162,255,.15)" stroke="${S}" stroke-width="2.5"/>
      <line x1="80" y1="35" x2="80" y2="115" stroke="${D}" stroke-width="2" stroke-dasharray="5,4"/>
      <text x="120" y="28" fill="${T}" font-size="13" text-anchor="middle">${fig.a}cm</text>
      <text x="120" y="134" fill="${T}" font-size="13" text-anchor="middle">${fig.b}cm</text>
      <text x="86" y="80" fill="${T}" font-size="12">${fig.h}cm</text>`;
  }
  quizFig.innerHTML = inner;
}
function makeChoices(ans){
  const set = new Set([ans]);
  const offsets = [1,-1,2,-2,3,-3,5,-5,10,-10, ans>4?Math.floor(ans/2):ans*2, ans*2];
  shuffle(offsets);
  for(const o of offsets){
    if(set.size>=4) break;
    const v = (o===ans*2 || o===Math.floor(ans/2)) ? o : ans+o;
    if(v>0 && !set.has(v)) set.add(v);
  }
  let k=1;
  while(set.size<4){ if(!set.has(ans+k*4)) set.add(ans+k*4); k++; }
  return shuffle([...set]);
}
function newProblem(){
  const gen = [genMixed, genGcdLcm, genArea][randi(0,2)];
  quiz = gen();
  quizLocked = false;
  quizTypeEl.textContent = '유형 · ' + quiz.typeName;
  quizQEl.textContent = quiz.q;
  drawFigure(quiz.fig);
  quizFeedback.textContent = '';
  if(quiz.format==='choice'){
    quizInputRow.classList.add('hidden');
    quizChoices.classList.remove('hidden');
    quizChoices.innerHTML='';
    for(const c of makeChoices(quiz.answer)){
      const b=document.createElement('button');
      b.className='choiceBtn';
      b.textContent=c;
      b.addEventListener('click', ()=> submitAnswer(c));
      quizChoices.appendChild(b);
    }
  }else{
    quizChoices.classList.add('hidden');
    quizInputRow.classList.remove('hidden');
    quizInput.value='';
    setTimeout(()=> quizInput.focus(), 50);
  }
  quizTimeLeft = QUIZ_TIME;
  if(quizTimerId) clearInterval(quizTimerId);
  quizTimerId = setInterval(()=>{
    quizTimeLeft -= 0.1;
    const pct = clamp(quizTimeLeft/QUIZ_TIME*100,0,100);
    quizTimerFill.style.width = pct+'%';
    quizTimerFill.classList.toggle('danger', quizTimeLeft<5);
    if(quizTimeLeft<=0) onWrong(true);
  },100);
}
function openQuiz(){
  quizOverlay.classList.remove('hidden');
  newProblem();
}
function submitAnswer(val){
  if(quizLocked) return;
  const num = Number(val);
  if(Number.isNaN(num) || val==='' || val===null) return;
  if(num === quiz.answer) onCorrect();
  else onWrong(false);
}
function onCorrect(){
  quizLocked = true;
  clearInterval(quizTimerId);
  let msg;
  if(chosenSkill==='__bonusHeal'){
    const heal = Math.floor(player.hpMax*0.3);
    player.hp = clamp(player.hp+heal,0,player.hpMax);
    msg = `정답! 🍱 체력 +${heal}`;
  }else if(chosenSkill.startsWith('evo:')){
    const base = chosenSkill.slice(4);
    SKILLS[base].evolved = true;
    renderSkillBar();
    burst(player.x, player.y, '#f5c542', 30);
    addFloatText(player.x, player.y-40, `✨ ${EVOLUTIONS[base].name}!`, '#f5c542');
    msg = `정답! ✨ ${SKILLS[base].name}이(가) ${EVOLUTIONS[base].name}(으)로 진화!`;
  }else{
    const gain = skillLevelUp(chosenSkill);
    const s = SKILLS[chosenSkill];
    msg = gain===2
      ? `정답! 🍀 클로버 발동! ${s.name} Lv${s.lv} (+2)`
      : `정답! ${s.name} Lv${s.lv} 획득`;
  }
  quizFeedback.style.color = '#4cc38a';
  quizFeedback.textContent = msg;
  setTimeout(closeQuiz, 900);
}
function onWrong(timeout){
  if(quizLocked) return;
  quizLocked = true;
  clearInterval(quizTimerId);
  const dmg = Math.max(1, Math.floor(player.hp*0.1));
  player.hp = Math.max(1, player.hp - dmg);
  quizFeedback.style.color = '#e5484d';
  quizFeedback.textContent = (timeout ? '⏰ 시간 초과! ' : '❌ 오답! ')
    + `체력 −${dmg} · 새 문제 출제 (정답: ${quiz.answer})`;
  burst(player.x, player.y, '#e5484d', 12);
  setTimeout(newProblem, 1300);
}
function closeQuiz(){
  quizOverlay.classList.add('hidden');
  chosenSkill = null;
  clearKeys();
  if(pendingLevelUps>0){ openCardSelect(); }
  else { state.paused = false; }
}
quizSubmit.addEventListener('click', ()=> submitAnswer(quizInput.value));
quizInput.addEventListener('keydown', e=>{
  if(e.key==='Enter') submitAnswer(quizInput.value);
});

function useItem(type){
  if(type==='magnet'){
    for(const g of gems) g.pull = true;
    addFloatText(player.x, player.y-30, '🧲 자석! 모든 보석 흡수', '#7aa2ff');
  }else if(type==='food'){
    const heal = Math.floor(player.hpMax*0.3);
    player.hp = clamp(player.hp + heal, 0, player.hpMax);
    addFloatText(player.x, player.y-30, `🍱 급식! +${heal} 회복`, '#4cc38a');
    burst(player.x, player.y, '#4cc38a', 12);
  }
}
function burst(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), s=rand(40,160);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.45),color});
  }
}
function addFloatText(x,y,text,color){ floatTexts.push({x,y,text,color,life:1.4}); }

/* =========================================================
 * 업데이트
 * ======================================================= */
function update(dt){
  // 보스전 중에는 게임 시간 정지 (난이도/HUD 시계 동결)
  if(!bossActive) state.time += dt;

  const iv = inputVec();
  if(iv.x||iv.y){ player.face = {x:iv.x, y:iv.y}; }
  player.moving = !!(iv.x||iv.y);
  if(player.moving) player.animT += dt;
  player.x += iv.x*player.speed*dt;
  player.y += iv.y*player.speed*dt;
  if(player.invuln>0) player.invuln -= dt;
  if(player.regen>0) player.hp = clamp(player.hp + player.regen*dt, 0, player.hpMax);

  // 보스전 중에는 일반/엘리트 스폰 중단
  if(!bossActive){
    spawnTimer -= dt;
    if(spawnTimer<=0){ spawnMonster(); spawnTimer = spawnInterval(); }
    eliteTimer -= dt;
    if(eliteTimer<=0){ spawnElite(); eliteTimer = ELITE_INTERVAL; }
    // 5분 단위 보스 스폰
    if(state.time >= nextBossAt) spawnBoss();
  }

  // ---- 보스 패턴 사이클 ----
  if(bossActive && boss && boss.hp>0){
    // Phase 2 진입 (체력 50% 미만)
    if(!boss.phase2 && boss.hp < boss.hpMax*0.5){
      boss.phase2 = true;
      boss.speed = 48;
      bossZoneTimer = 2.5;   // 장판은 휘두르기/파동과 2.5초 엇박자
      addFloatText(boss.x, boss.y-64, '💢 PHASE 2 — 보스 분노!', '#ff6b6b');
      burst(boss.x, boss.y, '#ff6b6b', 26);
    }
    bossAtkTimer -= dt;
    if(bossAtkTimer<=0){
      bossAtkTimer = 5.0;   // 패턴 간격 5초
      if(boss.phase2){
        bossPatternSweep();   // Phase 2: 두 패턴 동시 사용
        bossPatternWaves();
      }else{
        if(bossPatternToggle===0) bossPatternSweep();
        else bossPatternWaves();
        bossPatternToggle ^= 1;   // 교대
      }
    }
    if(boss.phase2){
      bossZoneTimer -= dt;
      if(bossZoneTimer<=0){ bossZoneTimer = 5.0; bossPatternZones(); }
    }
  }

  // 보스 휘두르기 판정 (보스 중심 추적)
  for(const s of bossSweeps){
    s.t -= dt;
    if(s.phase==='tele' && s.t<=0){
      s.phase='hit'; s.t=0.3;
      if(boss && dist2(player.x,player.y,boss.x,boss.y) < (s.r+player.r)**2){
        if(hurtPlayer(boss.dmg)) return;
      }
    }
  }
  bossSweeps = bossSweeps.filter(s=> !(s.phase==='hit' && s.t<=0));

  // 보스 파동 투사체
  for(const b of enemyBullets){
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if(b.life>0 && dist2(b.x,b.y,player.x,player.y) < (b.r+player.r)**2){
      b.life = 0;
      if(hurtPlayer(b.dmg)) return;
    }
  }
  enemyBullets = enemyBullets.filter(b=> b.life>0);

  // 보스 추적 장판
  for(const z of bossZones){
    z.t -= dt;
    if(z.phase==='delay' && z.t<=0){
      z.phase='tele'; z.t=0.8;
      z.x = player.x; z.y = player.y;   // 발동 시점의 플레이어 위치 조준
    }else if(z.phase==='tele' && z.t<=0){
      z.phase='hit'; z.t=0.25;
      burst(z.x, z.y, '#ff8c42', 14);
      if(dist2(player.x,player.y,z.x,z.y) < (z.r+player.r)**2){
        if(hurtPlayer(boss ? boss.dmg : 40)) return;
      }
    }
  }
  bossZones = bossZones.filter(z=> !(z.phase==='hit' && z.t<=0));

  // ---- 무기 트리거 ----
  if(SKILLS.whip.lv>0){ weaponTimers.whip -= dt;
    if(weaponTimers.whip<=0){ triggerWhip(); weaponTimers.whip = whipCooldown(); } }
  if(SKILLS.wand.lv>0){ weaponTimers.wand -= dt;
    if(weaponTimers.wand<=0){ triggerWand(); weaponTimers.wand = wandCooldown(); } }
  if(SKILLS.knife.lv>0){ weaponTimers.knife -= dt;
    if(weaponTimers.knife<=0){ triggerKnife(); weaponTimers.knife = knifeCooldown(); } }
  if(SKILLS.axe.lv>0){ weaponTimers.axe -= dt;
    if(weaponTimers.axe<=0){ triggerAxe(); weaponTimers.axe = axeCooldown(); } }
  if(SKILLS.cross.lv>0){ weaponTimers.cross -= dt;
    if(weaponTimers.cross<=0){ triggerCross(); weaponTimers.cross = crossCooldown(); } }

  // 시차 발사 큐 처리
  for(const s of wandQueue){ s.t -= dt; if(s.t<=0){ execWandShot(); s.done=true; } }
  wandQueue = wandQueue.filter(s=> !s.done);
  for(const s of whipQueue){ s.t -= dt; if(s.t<=0){ execWhipSlash(s.side); s.done=true; } }
  whipQueue = whipQueue.filter(s=> !s.done);

  // 투사체
  for(const b of bullets){ b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt; }
  bullets = bullets.filter(b=> b.life>0);

  // 채찍 슬래시 판정
  for(const sl of slashes){
    sl.life -= dt;
    for(const m of monsters){
      if(!sl.hit.has(m) && circleRect(m.x,m.y,m.r, sl.x,sl.y,sl.w,sl.h)){
        sl.hit.add(m);
        damageMonster(m, sl.dmg, '#e8ecf5');
      }
    }
  }
  slashes = slashes.filter(s=> s.life>0);

  // 도끼 휩쓸기 판정 (플레이어 중심 추적)
  for(const sw of sweeps){
    sw.life -= dt;
    for(const m of monsters){
      if(!sw.hit.has(m) && dist2(m.x,m.y,player.x,player.y) < (sw.r+m.r)**2){
        sw.hit.add(m);
        damageMonster(m, sw.dmg, '#f5c542');
      }
    }
  }
  sweeps = sweeps.filter(s=> s.life>0);

  // 십자가 빛기둥
  for(const p of pillars){
    p.t -= dt;
    if(p.phase==='tele' && p.t<=0){
      p.phase='hit'; p.t=0.25;
      for(const m of monsters){
        if(dist2(m.x,m.y,p.x,p.y) < (p.r+m.r)**2){
          damageMonster(m, p.dmg, '#f5c542');
        }
      }
    }
  }
  pillars = pillars.filter(p=> !(p.phase==='hit' && p.t<=0));

  // 마늘 오라 (틱 데미지 0.5초 + 밀어내기는 1초마다 0.1초 동안만)
  if(SKILLS.garlic.lv>0){
    const gr = garlicRadius();
    weaponTimers.garlicTick -= dt;
    const doTick = weaponTimers.garlicTick<=0;
    if(doTick) weaponTimers.garlicTick = 0.5;

    // 1초 주기로 0.1초짜리 밀어내기 창 열기
    weaponTimers.garlicPush -= dt;
    if(weaponTimers.garlicPush<=0){
      weaponTimers.garlicPush = 1.0;
      weaponTimers.garlicPushWin = 0.1;
    }
    const pushing = weaponTimers.garlicPushWin>0;
    if(pushing) weaponTimers.garlicPushWin -= dt;

    for(const m of monsters){
      const d2v = dist2(m.x,m.y,player.x,player.y);
      if(d2v < (gr+m.r)**2){
        if(doTick) damageMonster(m, garlicDmg(), '#b7e34d');
        if(pushing && !m.boss){
          // 짧은 파동으로 밀어내기 (엘리트는 절반, 보스는 면역)
          const len = Math.sqrt(d2v)||1;
          const push = (m.elite ? 300 : 650) * dt;   // 0.1초 창 기준 총 30~65px
          m.x += (m.x-player.x)/len * push;
          m.y += (m.y-player.y)/len * push;
        }
      }
    }
  }

  // 몬스터 이동/충돌
  const FAR = 1500;   // 이 거리보다 멀어진 몬스터는 화면 가장자리로 재배치
  for(const m of monsters){
    if(dist2(m.x,m.y,player.x,player.y) > FAR*FAR){
      const p = offscreenPos(50);
      m.x = p.x; m.y = p.y;
    }
    const dx=player.x-m.x, dy=player.y-m.y, len=Math.hypot(dx,dy)||1;
    m.x += dx/len*m.speed*dt;
    m.y += dy/len*m.speed*dt;
    if(m.hitFlash>0) m.hitFlash-=dt;
    m.animT = (m.animT||0) + dt;

    if(player.invuln<=0 && dist2(m.x,m.y,player.x,player.y) < (m.r+player.r)**2){
      if(hurtPlayer(m.dmg)) return;
    }
    for(const b of bullets){
      if(b.life>0 && dist2(m.x,m.y,b.x,b.y) < (m.r+b.r)**2){
        if(b.pierce){
          if(!b.hit.has(m)){ b.hit.add(m); damageMonster(m, b.dmg, b.color); }
        }else{
          damageMonster(m, b.dmg, b.color);
          b.life = 0;
        }
      }
    }
  }

  const dead = monsters.filter(m=> m.hp<=0);
  for(const m of dead){
    state.kills++;
    if(m.boss){
      bossDrop(m.x, m.y);
      burst(m.x,m.y,'#ff6b6b',36);
      burst(m.x,m.y,'#f5c542',30);
      addFloatText(m.x, m.y-50, '👑 보스 처치!', '#f5c542');
      boss = null;
      bossActive = false;
      nextBossAt += 300;            // 다음 보스는 5분 뒤
      enemyBullets=[]; bossSweeps=[]; bossZones=[];
    }else if(m.elite){
      eliteDrop(m.x, m.y);
      burst(m.x,m.y,'#ff6b6b',24);
      burst(m.x,m.y,'#f5c542',18);
    }else{
      dropGem(m.x, m.y, m.xp);
      burst(m.x,m.y,'#f5c542',10);
      deathFx.push({x:m.x, y:m.y+m.r, t:0.45, flip: player.x < m.x});
    }
  }
  monsters = monsters.filter(m=> m.hp>0);

  // 붕괴 이펙트 수명 처리 + 빔 프레임 타이머
  for(const d of deathFx) d.t -= dt;
  deathFx = deathFx.filter(d=> d.t>0);
  if(bossBeamT>0) bossBeamT -= dt;

  for(const g of gems){
    const d2v = dist2(g.x,g.y,player.x,player.y);
    if(d2v < player.magnet**2) g.pull = true;
    if(g.pull){
      const dx=player.x-g.x, dy=player.y-g.y, len=Math.hypot(dx,dy)||1;
      g.x += dx/len*480*dt; g.y += dy/len*480*dt;
      if(len < player.r){ g.got = true; gainXP(g.xp); }
    }
  }
  gems = gems.filter(g=> !g.got);

  for(const it of items){
    it.bob += dt*3;
    if(dist2(it.x,it.y,player.x,player.y) < (it.r+player.r)**2){
      it.got = true; useItem(it.type);
    }
  }
  items = items.filter(it=> !it.got);

  for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  particles = particles.filter(p=> p.life>0);
  for(const f of floatTexts){ f.y -= 34*dt; f.life -= dt; }
  floatTexts = floatTexts.filter(f=> f.life>0);
}

/* =========================================================
 * 렌더
 * ======================================================= */
function draw(){
  const cam = camRect();
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0,0,cv.width,cv.height);

  ctx.save();
  ctx.translate(-cam.x, -cam.y);   // ===== 월드 좌표계 시작 =====

  // 유적 바닥 타일 (미러 타일링으로 이음새를 감춤)
  if(IMG.tile.complete && IMG.tile.naturalWidth){
    const tw = 320, th = 220;
    const i0 = Math.floor(cam.x/tw), j0 = Math.floor(cam.y/th);
    for(let i=i0; i*tw < cam.x+cam.w; i++){
      for(let j=j0; j*th < cam.y+cam.h; j++){
        const fx = ((i%2)+2)%2 ? -1 : 1;
        const fy = ((j%2)+2)%2 ? -1 : 1;
        ctx.save();
        ctx.translate(i*tw + tw/2, j*th + th/2);
        ctx.scale(fx, fy);
        ctx.drawImage(IMG.tile, -tw/2, -th/2, tw, th);
        ctx.restore();
      }
    }
    // 엔티티 가독성을 위한 어두운 오버레이
    ctx.fillStyle = 'rgba(6,9,17,0.42)';
    ctx.fillRect(cam.x, cam.y, cam.w, cam.h);
  }else{
    // 에셋 로딩 전 폴백: 격자
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    const gs = 64;
    const sx = Math.floor(cam.x/gs)*gs, sy = Math.floor(cam.y/gs)*gs;
    ctx.beginPath();
    for(let x=sx; x<=cam.x+cam.w; x+=gs){ ctx.moveTo(x,cam.y); ctx.lineTo(x,cam.y+cam.h); }
    for(let y=sy; y<=cam.y+cam.h; y+=gs){ ctx.moveTo(cam.x,y); ctx.lineTo(cam.x+cam.w,y); }
    ctx.stroke();
  }

  // 보스 추적 장판
  for(const z of bossZones){
    if(z.phase==='delay') continue;
    ctx.save();
    if(z.phase==='tele'){
      const urgency = 1 - z.t/0.8;
      ctx.globalAlpha = 0.35 + urgency*0.3;
      ctx.strokeStyle='#ff8c42'; ctx.lineWidth=3; ctx.setLineDash([8,6]);
      ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.12 + urgency*0.18;
      ctx.fillStyle='#ff8c42';
      ctx.beginPath(); ctx.arc(z.x,z.y,z.r*urgency,0,Math.PI*2); ctx.fill();
    }else{
      ctx.globalAlpha = clamp(z.t/0.25,0,1)*0.85;
      const grad = ctx.createRadialGradient(z.x,z.y,0, z.x,z.y,z.r);
      grad.addColorStop(0,'rgba(255,220,160,.95)');
      grad.addColorStop(1,'rgba(255,110,40,.2)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(z.x,z.y,z.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // 보스 360도 휘두르기 (보스 중심 추적)
  if(boss){
    for(const s of bossSweeps){
      ctx.save();
      if(s.phase==='tele'){
        const urgency = 1 - s.t/0.9;
        ctx.globalAlpha = 0.3 + urgency*0.4;
        ctx.strokeStyle='#ff4d4d'; ctx.lineWidth=4; ctx.setLineDash([10,7]);
        ctx.beginPath(); ctx.arc(boss.x,boss.y,s.r,0,Math.PI*2); ctx.stroke();
        ctx.setLineDash([]);
        // 안쪽에서 차오르는 위험 표시
        ctx.globalAlpha = 0.10 + urgency*0.12;
        ctx.fillStyle='#ff4d4d';
        ctx.beginPath(); ctx.arc(boss.x,boss.y,s.r*urgency,0,Math.PI*2); ctx.fill();
      }else{
        const a = clamp(s.t/0.3,0,1);
        ctx.globalAlpha = a*0.55;
        ctx.fillStyle='#ff4d4d';
        ctx.beginPath(); ctx.arc(boss.x,boss.y,s.r,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha = a;
        ctx.strokeStyle='#ffd0d0'; ctx.lineWidth=7;
        const prog = 1-a;
        ctx.beginPath();
        ctx.arc(boss.x,boss.y,s.r, prog*Math.PI*2 - 1.1, prog*Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 보스 파동 투사체
  for(const b of enemyBullets){
    ctx.save();
    ctx.shadowColor='#ff6b6b'; ctx.shadowBlur=12;
    ctx.fillStyle='#ff6b6b';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd0d0';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.45,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // 마늘 오라 (진화형은 보라색 영혼 오라)
  if(SKILLS.garlic.lv>0){
    const gr = garlicRadius();
    const evoG = SKILLS.garlic.evolved;
    const cIn  = evoG ? 'rgba(157,123,255,0)'   : 'rgba(183,227,77,0)';
    const cOut = evoG ? 'rgba(157,123,255,.26)' : 'rgba(183,227,77,.22)';
    const cLine= evoG ? 'rgba(157,123,255,.55)' : 'rgba(183,227,77,.5)';
    const cPulse=evoG ? 'rgba(220,200,255,.95)' : 'rgba(230,255,160,.95)';
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(state.time*4)*0.08;
    const grad = ctx.createRadialGradient(player.x,player.y,gr*0.5, player.x,player.y,gr);
    grad.addColorStop(0,cIn);
    grad.addColorStop(1,cOut);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(player.x,player.y,gr,0,Math.PI*2); ctx.fill();
    // 밀어내기 파동 순간에는 테두리가 번쩍
    const pulsing = weaponTimers.garlicPushWin>0;
    ctx.globalAlpha = 1;
    ctx.strokeStyle = pulsing ? cPulse : cLine;
    ctx.lineWidth = pulsing ? 5 : 2;
    ctx.beginPath(); ctx.arc(player.x,player.y,gr,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // 십자가 빛기둥
  for(const p of pillars){
    if(p.phase==='tele'){
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle='#f5c542'; ctx.lineWidth=2; ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }else{
      const a = clamp(p.t/0.25,0,1);
      ctx.save();
      ctx.globalAlpha = a*0.85;
      const grad = ctx.createRadialGradient(p.x,p.y,0, p.x,p.y,p.r);
      grad.addColorStop(0,'rgba(255,244,200,.95)');
      grad.addColorStop(1,'rgba(245,197,66,.15)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
      // 하늘에서 내려오는 빛줄기
      ctx.fillStyle = 'rgba(255,244,200,'+(a*0.5)+')';
      ctx.fillRect(p.x-p.r*0.25, 0, p.r*0.5, p.y);
      ctx.restore();
    }
  }

  // 도끼 휩쓸기 (진화형은 핏빛)
  for(const sw of sweeps){
    const prog = 1 - sw.life/sw.maxLife;
    const col = sw.evo ? '#ff5c5c' : '#f5c542';
    ctx.save();
    ctx.globalAlpha = 0.7*(sw.life/sw.maxLife)+0.2;
    ctx.strokeStyle=col; ctx.lineWidth=6;
    ctx.beginPath();
    ctx.arc(player.x,player.y,sw.r, prog*Math.PI*2 - 0.9, prog*Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 0.12*(sw.life/sw.maxLife);
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(player.x,player.y,sw.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // 채찍 슬래시 (진화형은 검보라색)
  for(const sl of slashes){
    const a = sl.life/sl.maxLife;
    ctx.save();
    ctx.globalAlpha = a*0.85;
    if(sl.evo){
      ctx.fillStyle='rgba(30,25,50,.95)';
      ctx.shadowColor='#9d7bff'; ctx.shadowBlur=14;
    }else{
      ctx.fillStyle='rgba(232,236,245,.85)';
    }
    ctx.translate(sl.x, sl.y);
    ctx.scale(sl.side, 1);
    // 초승달 모양 휘두름
    ctx.beginPath();
    ctx.ellipse(0,0, sl.w/2, sl.h/2, 0, -Math.PI/2, Math.PI/2);
    ctx.ellipse(-sl.w*0.12,0, sl.w/2.6, sl.h/2.6, 0, Math.PI/2, -Math.PI/2, true);
    ctx.fill();
    ctx.restore();
  }

  // 보석
  for(const g of gems){
    ctx.save();
    ctx.translate(g.x,g.y);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle = g.big ? '#f5c542' : '#4cc38a';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = g.big ? 14 : 8;
    ctx.fillRect(-g.r,-g.r,g.r*2,g.r*2);
    ctx.restore();
  }

  // 아이템
  for(const it of items){
    const oy = Math.sin(it.bob)*4;
    ctx.save();
    ctx.shadowColor = it.type==='magnet' ? '#7aa2ff' : '#4cc38a';
    ctx.shadowBlur = 16;
    ctx.font = '26px serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(it.type==='magnet' ? '🧲' : '🍱', it.x, it.y+oy);
    ctx.restore();
  }

  // 투사체 (단검은 길쭉하게, 월아천충은 초승달 검기)
  for(const b of bullets){
    if(b.crescent){
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(b.angle);
      ctx.fillStyle = '#1b1e2e';
      ctx.strokeStyle = '#9d7bff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#9d7bff'; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, b.r, -Math.PI/2, Math.PI/2);                    // 바깥 호
      ctx.arc(-b.r*0.5, 0, b.r*0.72, Math.PI/2, -Math.PI/2, true);  // 안쪽 호
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }else if(b.knife){
      ctx.save();
      ctx.translate(b.x,b.y);
      ctx.rotate(b.angle);
      ctx.fillStyle = b.color;
      ctx.fillRect(-9,-2.5,18,5);
      ctx.restore();
    }else{
      ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    }
  }

  // 몬스터 붕괴 이펙트 (일반 몬스터 처치 시)
  for(const d of deathFx){
    const img = IMG.mon4;
    if(img && img.complete && img.naturalWidth){
      const h = 34, w = h * img.naturalWidth / img.naturalHeight;
      ctx.save();
      ctx.globalAlpha = clamp(d.t/0.45, 0, 1);
      ctx.translate(d.x, d.y);
      if(d.flip) ctx.scale(-1,1);
      ctx.drawImage(img, -w/2, -h, w, h);
      ctx.restore();
    }
  }

  // 스프라이트 공용 드로잉 (발끝 기준 하단 정렬, 피격 시 밝게)
  function drawMonSprite(img, x, footY, targetH, refH, flip, flash){
    if(!(img && img.complete && img.naturalWidth)) return false;
    const h = targetH * img.naturalHeight / refH;   // 프레임별 원본 비율 유지
    const w = h * img.naturalWidth / img.naturalHeight;
    ctx.save();
    ctx.translate(x, footY);
    if(flip) ctx.scale(-1,1);
    if(flash) ctx.filter = 'brightness(2.2)';
    ctx.drawImage(img, -w/2, -h, w, h);
    ctx.restore();
    return true;
  }

  // 몬스터
  for(const m of monsters){
    const flip = player.x > m.x;   // 플레이어 쪽을 바라보도록 (원본은 좌향 기준)
    if(m.boss){
      // 보스 스프라이트: 패턴별 프레임 전환
      //  boss0 대기(π) / boss1 차지 발광 / boss2 촉수 휘두르기(Σ)
      //  boss3 빔 발사 / boss4 육면체 장판 시전 / boss5 Phase 2 발광
      let img = m.phase2 ? IMG.boss5 : IMG.boss0;
      if(bossZones.length>0)                                 img = IMG.boss4;
      else if(bossSweeps.length>0)                           img = IMG.boss2;
      else if(bossBeamT>0)                                   img = IMG.boss3;
      else if(bossActive && bossAtkTimer<1.0)                img = IMG.boss1;   // 공격 준비 차지
      // Phase 2 붉은 오라
      ctx.save();
      ctx.shadowColor = m.phase2 ? '#ff3b3b' : 'rgba(94,234,212,.9)';
      ctx.shadowBlur  = m.phase2 ? 34 : 20;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r*0.9, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,0.01)'; ctx.fill();   // 그림자 발광만 사용
      ctx.restore();
      const bob = Math.sin((m.animT||0)*2.2)*4;   // 부유 연출
      if(!drawMonSprite(img, m.x, m.y + m.r + bob, 132, 190, false, m.hitFlash>0)){
        ctx.fillStyle = m.hitFlash>0 ? '#fff' : '#3d1052';
        ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
      }
    }else if(m.elite){
      // 엘리트 골렘: 3프레임 걷기 (0-1-2-1), 근접 시 기둥 내려치기 포즈
      const near = dist2(m.x,m.y,player.x,player.y) < 120*120;
      let img;
      if(near){
        img = IMG.elite3;                       // 기둥 치켜든 공격 포즈
      }else{
        const cyc = [IMG.elite0, IMG.elite1, IMG.elite2, IMG.elite1];
        img = cyc[Math.floor((m.animT||0)/0.2)%4];
      }
      if(!drawMonSprite(img, m.x, m.y + m.r, 80, 130, flip, m.hitFlash>0)){
        ctx.fillStyle = m.hitFlash>0 ? '#fff' : '#c92a2a';
        ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
      }
      const w = 64;
      ctx.fillStyle='rgba(0,0,0,.6)';
      ctx.fillRect(m.x-w/2, m.y-m.r-34, w, 6);
      ctx.fillStyle='#ff6b6b';
      ctx.fillRect(m.x-w/2, m.y-m.r-34, w*(m.hp/m.hpMax), 6);
    }else{
      // 일반 몬스터: 사면체 굴러오기 (0-2-3-2)
      const cyc = [IMG.mon0, IMG.mon2, IMG.mon3, IMG.mon2];
      const img = cyc[Math.floor((m.animT||0)/0.16)%4];
      if(!drawMonSprite(img, m.x, m.y + m.r + 4, 36, 64, flip, m.hitFlash>0)){
        ctx.fillStyle = m.hitFlash>0 ? '#fff' : '#b34ddb';
        ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2); ctx.fill();
      }
      if(m.hp < m.hpMax){
        const w = 26;
        ctx.fillStyle='rgba(0,0,0,.55)';
        ctx.fillRect(m.x-w/2, m.y-m.r-11, w, 4);
        ctx.fillStyle='#e5484d';
        ctx.fillRect(m.x-w/2, m.y-m.r-11, w*(m.hp/m.hpMax), 4);
      }
    }
  }

  // 플레이어
  // 플레이어 스프라이트 (피격 무적 중엔 깜빡임)
  if(!(player.invuln>0 && Math.floor(player.invuln*20)%2===0)){
    const SH = 84;   // 화면상 스프라이트 높이
    let img = IMG.idle, flip = false;
    if(player.invuln > 0.25 && IMG.hurt.complete){
      img = IMG.hurt;                       // 방금 맞음: 어지러운 포즈
    }else if(player.moving){
      const f = player.face;
      if(Math.abs(f.x) >= Math.abs(f.y)){
        // 좌우: 걷기 2프레임 교대
        // 원본 스프라이트가 walk1은 왼쪽, walk2는 오른쪽을 보고 있으므로
        // 이동 방향에 맞춰 프레임별로 반전을 따로 적용 → 항상 진행 방향만 바라봄
        const frameA = Math.floor(player.animT/0.16)%2===0;
        img = frameA ? IMG.walk1 : IMG.walk2;
        const left = f.x < 0;
        flip = frameA ? left : !left;   // [수정] 좌우 반전이 반대로 적용되던 문제 수정
      }else if(f.y < 0){
        img = IMG.up;                       // 위: 뒷모습
      }else{
        img = IMG.down;                     // 아래: 정면 걷기 (반전 교대로 걸음 연출)
        flip = Math.floor(player.animT/0.22)%2===1;
      }
    }
    if(img && img.complete && img.naturalWidth){
      const w = SH * img.naturalWidth / img.naturalHeight;
      const bob = player.moving ? Math.sin(player.animT*14)*2 : Math.sin(state.time*3)*1.5;
      ctx.save();
      ctx.translate(player.x, player.y - SH*0.18 + bob);
      if(flip) ctx.scale(-1,1);
      ctx.drawImage(img, -w/2, -SH/2, w, SH);
      ctx.restore();
    }else{
      // 에셋 로딩 전 폴백: 원형
      ctx.fillStyle = '#f0f3fa';
      ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2); ctx.fill();
    }
  }

  const hw = 44;
  ctx.fillStyle='rgba(0,0,0,.55)';
  ctx.fillRect(player.x-hw/2, player.y+30, hw, 6);
  ctx.fillStyle='#e5484d';
  ctx.fillRect(player.x-hw/2, player.y+30, hw*clamp(player.hp/player.hpMax,0,1), 6);

  for(const p of particles){
    ctx.globalAlpha = clamp(p.life*3,0,1);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = 'bold 15px "Malgun Gothic", sans-serif';
  for(const f of floatTexts){
    ctx.globalAlpha = clamp(f.life,0,1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();   // ===== 월드 좌표계 끝 =====

  // 보스 체력바 (화면 상단 고정)
  if(bossActive && boss){
    const bw = Math.min(cv.width*0.6, 520), bh = 14;
    const bx = (cv.width-bw)/2, by = 64;
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.font = 'bold 14px "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#ff6b6b';
    ctx.shadowColor='#000'; ctx.shadowBlur=4;
    ctx.fillText('👑 BOSS' + (boss.phase2 ? ' — PHASE 2' : ''), cv.width/2, by-4);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.fillRect(bx-2, by-2, bw+4, bh+4);
    ctx.fillStyle = boss.phase2 ? '#ff3b3b' : '#c9484d';
    ctx.fillRect(bx, by, bw*clamp(boss.hp/boss.hpMax,0,1), bh);
    ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1;
    ctx.strokeRect(bx, by, bw, bh);
    // 50% 지점(Phase 2) 눈금
    ctx.strokeStyle='rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.moveTo(bx+bw/2, by); ctx.lineTo(bx+bw/2, by+bh); ctx.stroke();
    ctx.restore();
  }

  // 가상 조이스틱 (화면 좌표계)
  if(joy.active){
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#e8ecf5';
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, joy.max, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(joy.ox+joy.dx, joy.oy+joy.dy, 26, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

// ---------- HUD ----------
const xpFill = document.getElementById('xpFill');
const lvlTag = document.getElementById('lvlTag');
const timeTag= document.getElementById('timeTag');
const killTag= document.getElementById('killTag');
function updateHUD(){
  const need = xpNeeded(player.level);
  xpFill.style.width = (player.level>=MAX_LEVEL ? 100 : clamp(player.xp/need*100,0,100)) + '%';
  lvlTag.textContent = 'LV ' + player.level;
  const t = Math.floor(state.time);
  timeTag.textContent = String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
  killTag.textContent = '처치 ' + state.kills;
}

/* =========================================================
 * 게임 흐름 + 시작 무기 선택
 * ======================================================= */
function resetGame(){
  state.time=0; state.kills=0; state.over=false; state.paused=false;
  player.x = 0; player.y = 0;   // 무한 맵: 월드 원점에서 시작
  player.level = 1; player.xp = 0; player.invuln = 0;
  player.face = {x:1,y:0};
  for(const key in SKILLS){ SKILLS[key].lv = 0; SKILLS[key].evolved = false; }
  whipEvoSide = 1;
  applySkillStats();
  player.hp = player.hpMax;
  renderSkillBar();
  monsters=[]; bullets=[]; gems=[]; items=[]; particles=[]; floatTexts=[];
  slashes=[]; sweeps=[]; pillars=[]; wandQueue=[]; whipQueue=[];
  spawnTimer = 0; eliteTimer = ELITE_INTERVAL;
  boss = null; bossActive = false; nextBossAt = 300;
  enemyBullets=[]; bossSweeps=[]; bossZones=[];
  deathFx=[]; bossBeamT=0;
  document.getElementById('eliteWarn').textContent = '⚠ 엘리트 몬스터 출현 ⚠';
  for(const k in weaponTimers) weaponTimers[k]=0;
  pendingLevelUps = 0;
  if(quizTimerId) clearInterval(quizTimerId);
}

// 시작 화면: 액티브 6종 카드
function showStartSelect(){
  const row = document.getElementById('startCardRow');
  row.innerHTML = '';
  for(const key in SKILLS){
    if(SKILLS[key].kind !== 'active') continue;
    row.appendChild(makeCardBtn(key, k=>{
      SKILLS[k].lv = 1;
      applySkillStats();
      renderSkillBar();
      document.getElementById('startOverlay').classList.add('hidden');
      state.running = true;
    }));
  }
  document.getElementById('startOverlay').classList.remove('hidden');
}

function gameOver(){
  state.over = true;
  const t = Math.floor(state.time);
  document.getElementById('overMsg').innerHTML =
    `생존 시간 <b>${Math.floor(t/60)}분 ${t%60}초</b> · 레벨 <b>${player.level}</b> · 처치 <b>${state.kills}</b>`;
  document.getElementById('overOverlay').classList.remove('hidden');
}

let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.05);
  last = now;
  if(state.running && !state.paused && !state.over){
    update(dt);
  }
  draw();
  updateHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('retryBtn').addEventListener('click', ()=>{
  document.getElementById('overOverlay').classList.add('hidden');
  state.running = false;
  resetGame();
  showStartSelect();
